  - category: curriculum
    question: 교육 과정 중간에 포기하면 불이익이 있나요?
    answer: |
      SK 내부 채용 전형 자체에는 불이익이 없는 것으로 안내되고 있습니다.
      다만 판교 캠퍼스는 고용노동부 K-Digital Training(KDT)과 연계되어 있어, 중도 포기 시 국민내일배움카드 갱신 주기인 5년 동안 다른 KDT 과정을 무료로 재신청할 수 없습니다. 5년 경과 후 카드를 새로 발급받으면 재신청이 가능합니다. (광주·울산 캠퍼스는 SK 자체 운영으로 이 제한이 적용되지 않습니다.)
    source_url: null
    note: KDT 5년 재신청 제한은 검색으로 확인됨. "SK 내부 채용 전형 불이익 없음" 부분은 원문 미확인
