# SKALA 모집 문의 FAQ 시드 데이터
#
# faq 테이블 컬럼: category, question, answer, source_url
# `faq` 리스트만 자동으로 DB에 삽입한다. `examples_unverified`는
# 원문 대조가 끝나기 전까지 삽입 대상에서 제외한다 (qna.md 참고).

faq:
  - category: application
    question: 지원서 최종 제출 이후, 지원서 수정이 가능한가요?
    answer: |
      최종 제출을 완료하신 후에는 지원서 수정이 불가능합니다. 기재 내용을 상세히 확인하신 후 최종 제출하시기 바랍니다.
    source_url: null

  - category: curriculum
    question: 교육비는 전액 무료인가요?
    answer: |
      네, 모든 캠퍼스의 교육비는 전액 무료입니다. 다만, 운영 방식에 따라 캠퍼스별 지원 조건이 다릅니다.
      판교 캠퍼스의 경우 고용노동부와 함께하는 'K-Digital Training(KDT)' 과정으로, 국민내일배움카드 발급이 가능하고 KDT 수강 이력이 없으며 카드 잔액을 보유하신 분만 지원 가능합니다.
      - 광주, 울산 캠퍼스는 국민내일배움카드 없이 지원 가능 (SK 자체 운영)
    source_url: null

  - category: admission
    question: 2027년 2월 졸업 예정자 또는 재학생인데 지원할 수 있나요? (학업 병행 관련)
    answer: |
      지원 가능합니다. 다만, 본 과정은 높은 몰입도가 필요한 오프라인 중심의 전일제 교육이므로 휴학 또는 졸업 유예 상태여야 원활한 수강이 가능합니다.
      만약 재학생이거나 이수해야 할 학점이 남은 경우에는 VOD 수업이나 주말 온라인(비대면) 수업만으로 3학점 이하의 학점 이수가 가능한 상태여야 합니다. 교육 시간 중 학교에 출석해야 하는 오프라인 수업이나 SKALA 수업 시간과 겹치는 실시간 비대면 학과 수업은 병행이 불가합니다.
    source_url: null

  - category: admission
    question: 정말 학력이나 전공에 상관없이 지원 가능한가요? 비전공자가 불리하지는 않을까요?
    answer: |
      네, 전공과 학력 제한이 없습니다. SKALA가 가장 중요하게 보는 것은 '현재의 전공'이 아니라 'AI 전문가로 성장하려는 의지와 잠재력'입니다. 실제 지난 SKALA 3기 교육생의 40% 이상이 비전공자로, 인문·사회 등 타 전공 지식과 AI 기술을 융합할 수 있는 인재를 환영합니다.
    source_url: null

  - category: hiring
    question: "'채용 연계'라는 말이 정확히 어떤 의미인가요?"
    answer: |
      본 교육 과정을 우수한 성적으로 수료한 분들에게 SK그룹 채용 연계 기회를 제공한다는 뜻입니다.
      대상은 SKALA와 채용 협약을 맺은 SK AX 등 SK그룹의 주요 계열사 및 자회사와 함께할 예정이며, 교육 기간 중 진행되는 채용 설명회 등을 통해 참여 기업 리스트와 직무를 상세히 안내해 드릴 예정입니다.
      6개월간 치열한 학습을 통해 실력을 증명한 수료생분들께서 가장 원하는 곳으로 도약할 수 있도록 SKALA가 지원하겠습니다.
    source_url: null

  - category: application
    question: 여러 SK 계열회사 모집 공고에 중복해서 지원할 수 있나요?
    answer: |
      SK Careers 내에서 1개의 공고만 지원이 가능합니다.
      전형을 진행 중인 공고가 있을 경우, 해당 전형이 종료된 이후 타 공고에 지원이 가능하니 참고 부탁드립니다.
    source_url: null

  - category: application
    question: 지원서 작성 시 임시저장과 제출은 어떤 차이가 있나요?
    answer: |
      지원서를 작성하다 필요 사항을 확인하기 위해 지원자는 작성 중인 지원서를 임시저장 할 수 있습니다.
      다만, 임시 저장된 지원서는 제출이 아니라 별도의 DB에 임시로 저장된 것을 의미합니다.
      따라서, 지원 회사에 제대로 지원하기 위해서는 반드시 제출 버튼을 눌러 작성한 지원서를 제출하여야 지원한 것으로 인정되므로, 이 점 꼭 유의해 주시기를 바랍니다.
    source_url: null

  - category: application
    question: 지원서 제출이 안 되는데 왜 그럴까요?
    answer: |
      지원서 제출이 안 되는 경우는 여러 원인이 있으므로 먼저 다음 사항을 체크해 주시기를 바랍니다.
      1) 내용이 정확하게 입력되지 않았거나, 누락된 경우: 이런 경우, 에러체크 안내 메시지가 나타나므로 메시지에 따라 보완해 주시기를 바랍니다.
      2) 지원자의 PC와 인터넷 연결이 끊어진 경우: 가끔 접속이 원활하지 않아 끊어지는 경우가 있을 수 있습니다. 본인 PC의 네트워크 상태를 확인해 주시기를 바랍니다.
      3) 지원자가 많아 서버에 부하가 있는 경우: 마감일이 임박하여 제출하는 경우, 지원자가 한꺼번에 몰려 지원서 제출이 어려울 수 있습니다. 이 경우, 제출 버튼을 여러 번 누르기보다는 임시저장 후 잠시 후에 다시 제출해 주시기를 바랍니다.
    source_url: null

  - category: application
    question: 지원서 제출이 잘 되었는지 확인하고 싶습니다.
    answer: |
      지원서 제출이 완료되면 화면에 지원서 접수 성공 메시지가 뜨게 됩니다.
      이 메시지를 확인하지 못한 경우, 지원서 수정메뉴에서 지원 확인 버튼을 통해 지원서 접수 여부를 확인할 수 있습니다.
      확인 위치: 지원 내역 → 지원한 공고명 클릭 → 지원서
      만약, 지원 확인 버튼을 통해 지원서 접수 메시지가 나타나지 않으면 지원서가 임시저장 되어있을 수 있습니다.
      이 경우, 동일 화면의 지원서 수정 버튼을 클릭하여 본인의 지원서를 Open 한 후 상단의 제출 버튼을 다시 한번 눌러 제출해 주시기를 바랍니다.
      만약, 비슷한 문제가 계속 발생하는 경우 1:1의 '시스템 문의'를 통해 문의해 주시기를 바랍니다.
    source_url: null

  - category: application
    question: 모집 공고의 접수 마감 이전에 지원서를 수정하거나 지원을 취소하고 싶습니다. 어떻게 해야 할까요?
    answer: |
      지원하신 모집 공고가 마감되기 전까지 지원서 수정, 지원 취소가 가능합니다.
      확인 위치: 지원 내역 → 지원서를 최종 제출한 공고명 클릭 → 전형별 진행 상황 및 결과 > 우측 하단 '지원 철회'
      지원 철회 이후에는 지원서 임시저장 상태로 변경되며, 해당 공고 재지원을 위해서는 기간 내 최종제출을 다시 해주셔야 됩니다.
    source_url: null

  - category: admission
    question: 지원 시, 외국어 성적이 필수인가요?
    answer: |
      외국어 성적은 필수 지원 자격이 아닙니다.
      다만 공고에 따라 우대조건인 경우도 있으니 자세한 사항은 해당 공고를 확인해 주시기를 바랍니다.
    source_url: null

  - category: application
    question: 지원과 관련하여, 증빙 서류는 어떻게 제출해야 하나요?
    answer: |
      서류전형에 통과한 분들에게 필기 또는 면접전형 시 준비해야 하는 서류와 제출 방법에 대해 개별적으로 안내해 드립니다.
    source_url: null

  - category: admission
    question: 신입 채용의 경우에도 경력이 인정되나요?
    answer: |
      타 회사에서의 경력 사항 등은 참고 자료로 활용될 수 있으나, 신입 또는 인턴 채용의 경우 기존 경력은 인정되지 않습니다.
    source_url: null

  - category: admission
    question: 기존에 지원했다가 탈락하여 다시 응시하려고 합니다. 불이익이 있나요?
    answer: |
      기존 전형에서 탈락 후 재지원 하시는 경우에도 불이익은 없습니다.
      부족한 부분을 보완하셔서 지원해 주시는 만큼, 더욱 훌륭한 모습을 보여주실 수 있을 거라 믿습니다.
      여러 차례 지원하셔서 SK 구성원이 되신 분들도 있는 만큼, 걱정하지 마시고 자신 있게 지원해 주시기를 바랍니다.
    source_url: null

  - category: admission
    question: 서류전형에서 주로 고려되는 사항은 무엇인가요?
    answer: |
      서류전형에서는 지원자가 작성해 주신 경험과 역량이 모집하고 있는 직무와 얼마나 잘 맞는지를 중점적으로 검증합니다.
      그 외에도, 지원자의 가치관이 SK그룹과 얼마나 잘 맞는지를 종합적으로 고려하여 판단합니다.
    source_url: null

  # 아래는 SKALA 공식 모집 페이지 원문을 근거로 추가한 항목이다.
  # 같은 사실도 질문 표현을 바꿔 여러 행으로 넣어 검색 적중률을 올린다

  - category: admission
    question: 지원 자격이 어떻게 되나요? 나이 제한이 있나요?
    answer: |
      대한민국 청년이라면 누구나 지원 가능하며, 나이 요건은 만 19세 이상 만 34세 이하입니다.
      100% 오프라인 Full-time 과정이므로 교육 기간 동안 이수해야 하는 학기·학점이 없어야 하며, 직장·학교·타 부트캠프(교육) 등과의 병행은 불가합니다.
    source_url: null

  - category: admission
    question: 제가 지원할 수 있는 조건이 궁금합니다.
    answer: |
      대한민국 청년이라면 누구나 지원 가능하며, 나이 요건은 만 19세 이상 만 34세 이하입니다.
      100% 오프라인 Full-time 과정이므로 교육 기간 동안 이수해야 하는 학기·학점이 없어야 하며, 직장·학교·타 부트캠프(교육) 등과의 병행은 불가합니다.
    source_url: null

  - category: admission
    question: 병역 관련해서 지원 자격에 제한이 있나요?
    answer: |
      해외여행에 결격사유가 없는 분이어야 지원 가능합니다. 병역 대상자의 경우 병역필 또는 면제자 등, 해외여행 결격사유가 없는 상태여야 합니다.
    source_url: null

  - category: schedule
    question: 지원서 접수는 언제까지인가요?
    answer: |
      모집 기간은 04.20(월) ~ 05.13(수) 17:00까지입니다. 마감 시간 이후에는 접수가 불가하니 시간 전에 제출을 완료해 주시기 바랍니다.
    source_url: null

  - category: schedule
    question: 서류 마감일이 정확히 언제인가요?
    answer: |
      모집 기간은 04.20(월) ~ 05.13(수) 17:00까지입니다. 마감 시간 이후에는 접수가 불가하니 시간 전에 제출을 완료해 주시기 바랍니다.
    source_url: null

  - category: schedule
    question: 전형 절차와 일정이 어떻게 되나요?
    answer: |
      지원서 접수(5.13(수) 17:00까지) → SKCT(5월 말) → 역량면접(5월 말) → 합격 안내(6월 중) 순으로 진행됩니다.
      SKALA는 채용연계 과정인 만큼 신입 공채와 유사한 프로세스로 진행되며, 전형 절차 및 일정은 내부 사정에 따라 변동될 수 있습니다.
    source_url: null

  - category: schedule
    question: SKCT는 어떻게 진행되나요? 예전에 본 SKCT 점수도 인정되나요?
    answer: |
      SKCT는 온라인으로 진행되며 심층 검사만 진행합니다. 응시일 기준 4개월 이내에 SKCT 응시 이력이 있는 경우, 기존 SKCT 점수로 대체됩니다.
    source_url: null

  - category: curriculum
    question: 교육 기간과 교육 시간이 어떻게 되나요?
    answer: |
      교육 기간은 2026년 7월부터 2026년 12월까지 약 5개월간 진행되며, 교육 시간은 평일 09:00~18:00, 100% 오프라인 출석이 필요합니다.
    source_url: null

  - category: curriculum
    question: 교육 장소는 어디인가요? 캠퍼스가 여러 곳인가요?
    answer: |
      SKALA 판교캠퍼스(성남시), 광주캠퍼스(광주광역시), 울산캠퍼스(울산광역시) 세 곳에서 운영됩니다.
      캠퍼스별 운영 방식 차이(판교는 KDT 연계, 광주·울산은 SK 자체 운영)가 있으니 지원 전 확인해 주시기 바랍니다.
    source_url: null

  - category: curriculum
    question: 팀 프로젝트는 어떤 방식으로 진행되나요?
    answer: |
      SK그룹 현업 조직이 직접 제시한 실제 비즈니스 문제를 기반으로 팀 단위 프로젝트를 수행합니다.
      현업 인터뷰를 통해 SK그룹 내 주제 Pool을 선정한 뒤, 팀 구성 → 주제 선정 → 프로젝트 수행(기획/설계/개발) → 최종평가/수료식 순으로 진행되며, 프로젝트 전 과정에 현직자 멘토링이 함께합니다.
    source_url: null

  - category: curriculum
    question: 오프라인 교육이 부담되는데 온라인으로 미리 참여해볼 방법이 있나요?
    answer: |
      학기 중이라 오프라인 교육이 부담된다면 온라인 과정인 Pre-SKALA로 먼저 시작해볼 수 있습니다.
      홈페이지에서 사전 신청하면 참여 기회를 우선 안내받을 수 있습니다.
    source_url: null

  - category: benefit
    question: 참여하면 어떤 혜택이 있나요?
    answer: |
      교육비 전액 지원 외에도 다음 혜택이 제공됩니다.
      - 출석률 90% 달성 시 월 100만원 SK 장학금 지급
      - 최대 월 50만원 교육지원금
      - 프로젝트 우수팀 상금
      - 교육 기간 중 최신 맥북 무상 지원
      - 중식 지원
      - 1:1 취업컨설팅 및 현직자 멘토링
      - SK그룹 채용 시 우대
    source_url: null

  - category: benefit
    question: 교육비 말고 생활비나 장비 지원도 되나요?
    answer: |
      교육비 전액 지원 외에도 다음 혜택이 제공됩니다.
      - 출석률 90% 달성 시 월 100만원 SK 장학금 지급
      - 최대 월 50만원 교육지원금
      - 프로젝트 우수팀 상금
      - 교육 기간 중 최신 맥북 무상 지원
      - 중식 지원
      - 1:1 취업컨설팅 및 현직자 멘토링
      - SK그룹 채용 시 우대
    source_url: null

