    question: 입과가 확정되었는데, 재직 중인 회사의 퇴사 처리는 언제까지 완료해야 하나요?
    answer: |
      입과 예정일 기준 최소 10일 전까지는 퇴사 처리가 완료되어야 합니다. 정확한 기한은 기수별 입과 안내 공지를 반드시 확인해 주시기 바랍니다.
