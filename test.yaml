# 테스트용 메일 시나리오
# process_email(subject=..., body_text=...)에 그대로 태울 수 있는 형식이다.
#
# name: 이 케이스의 "예측 판정값" + 번호. auto_reply / draft_review / escalate 중 하나로 시작해야 한다
#       (테스트-3에서 실제 decision과 자동으로 비교하기 위한 식별자).
# subject/body: 실제 메일 내용. 어떤 질문인지는 subject로 알아본다.
#
# auto_reply 계열은 검색이 faq.question 임베딩만 보고 매칭한다는 점을 고려해,
# FAQ 질문 문장과 실제로 가까운 표현으로 작성했다 (search_faq로 거리 0.5 미만 사전 확인 완료).

- name: auto_reply_1
  subject: 지원 자격 문의드립니다
  body: |
    안녕하세요, 이번 모집에 관심 있는 학생입니다.
    다름이 아니라 지원 자격이 어떻게 되는지 궁금해서 메일 드립니다.
    감사합니다.
    홍길동 드림

- name: auto_reply_2
  subject: 타 SK 계열사 중복 지원 문의드립니다
  body: |
    안녕하세요, SKALA 지원을 준비 중인 지원자입니다.
    SKALA 말고 다른 SK 계열회사 공고에도 중복 지원이 가능한가요?
    답변 부탁드립니다. 감사합니다.

- name: auto_reply_3
  subject: 교육 혜택 문의드립니다
  body: |
    안녕하세요.
    SKALA에 참여하면 어떤 혜택을 받을 수 있나요?
    감사합니다.

- name: auto_reply_4
  subject: 교육 시간 문의드립니다
  body: |
    안녕하세요.
    평소 교육 시간은 어떻게 되나요?
    감사합니다.

- name: auto_reply_5
  subject: 팀 프로젝트 진행 방식 문의드립니다
  body: |
    안녕하세요.
    SKALA 프로젝트는 팀 단위로 어떻게 진행되나요?
    감사합니다.

- name: auto_reply_6
  subject: 전형 일정 문의드립니다
  body: |
    안녕하세요.
    채용 전형 절차와 세부 일정이 어떻게 되나요?
    확인 부탁드립니다. 감사합니다.

- name: auto_reply_7
  subject: SKCT 점수 재사용 문의드립니다
  body: |
    안녕하세요.
    예전에 본 SKCT 점수도 인정되나요?
    답변 부탁드립니다. 감사합니다.

- name: auto_reply_8
  subject: 교육비 문의드립니다
  body: |
    안녕하세요.
    교육비는 얼마인가요?
    감사합니다.

- name: escalate_1
  subject: 학점 관련 문의드립니다
  body: |
    안녕하세요.
    제 학점이 3.1인데 지원 가능할까요?
    확인 부탁드립니다. 감사합니다.

- name: escalate_2
  subject: 교육 관련 질문 있습니다
  body: |
    안녕하세요, SKALA 지원을 고민 중인 지원자입니다.
    교육 기간 중에 인턴을 병행할 수 있나요?
    그리고 교육비는 정말 전액 무료인지도 궁금합니다.
    바쁘신 와중에 답변 주시면 감사하겠습니다.
    이몽룡 드림

- name: escalate_3
  subject: 퇴사 처리 지연 관련 문의드립니다
  body: |
    안녕하세요.
    저번에 입과 확정 이전으로 퇴사 처리가 완료되어야 한다고 안내받았는데,
    기존에 다니는 회사에서 퇴사 처리가 늦어지고 있습니다. 이런 경우 입과가 불가능할까요?
    확인 부탁드립니다. 감사합니다.

- name: escalate_4
  subject: SKALA만의 차별점이 궁금합니다
  body: |
    안녕하세요, SKALA 지원을 고민 중인 사람입니다.
    다른 부트캠프와 다르게 SKALA만의 차별점이 있을까요?
    답변 기다리겠습니다. 감사합니다.

- name: escalate_5
  subject: SKALA 관련 질문 드립니다
  body: |
    안녕하세요, SKALA 지원을 준비 중인 지원자입니다.
    다른 부트캠프와 다르게 SKALA만의 차별점이 있을까요?
    그리고 역량면접은 언제 진행되는지도 함께 안내 부탁드립니다.
    감사합니다.
